<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="logo-pitangueiras.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="theme-color" content="#40800c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Locaprancha" />
    <link rel="apple-touch-icon" href="logo-pitangueiras.png" />
    <link rel="manifest" href="manifest.json" />
    <meta
      name="description"
      content="Locaprancha - Sistema inteligente de gestão de frota e transporte de equipamentos para a Usina Pitangueiras."
    />
    <meta
      name="keywords"
      content="gestão de frota, transporte de máquinas, usina pitangueiras, logística, equipamentos"
    />

    <meta property="og:title" content="Locaprancha - Gestão de Frota" />
    <meta
      property="og:description"
      content="Sistema inteligente de gestão de frota e transporte de equipamentos."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://julianotimoteo.github.io/locaprancha/" />
    <meta
      property="og:image"
      content="https://julianotimoteo.github.io/locaprancha/logo-pitangueiras.png"
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Locaprancha - Gestão de Frota" />
    <meta
      name="twitter:description"
      content="Sistema inteligente de gestão de frota e transporte de equipamentos para a Usina Pitangueiras."
    />
    <meta
      name="twitter:image"
      content="https://julianotimoteo.github.io/locaprancha/logo-pitangueiras.png"
    />

    <title>Locaprancha - Gestão de Frota</title>
  </head>
  <body class="bg-background">
    <div id="root"></div>

    <!-- Splash loader: visible while JS loads, React hides it after mount -->
    <div
      id="emergency-loader"
      style="
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: white;
        z-index: 9999;
        font-family: sans-serif;
        padding: 20px;
        text-align: center;
        transition: opacity 0.3s ease;
      "
    >
      <div
        style="
          width: 40px;
          height: 40px;
          border: 4px solid #40800c;
          border-top-color: transparent;
          border-radius: 50%;
          animation: spin 1s linear infinite;
          margin-bottom: 20px;
        "
      ></div>
      <h2 style="font-weight: 900; text-transform: uppercase; margin: 0; letter-spacing: -1px">
        Locaprancha
      </h2>
      <p
        style="
          font-size: 12px;
          color: #666;
          margin-top: 10px;
          font-weight: bold;
          text-transform: uppercase;
          letter-spacing: 1px;
        "
      >
        Carregando...
      </p>
      <style>
        @keyframes spin {
          to { transform: rotate(360deg); }
        }
      </style>
      <script>
        // Automatic cleanup: Guarantee loader is hidden after 1.5s max
        setTimeout(function() {
          var loader = document.getElementById("emergency-loader");
          if (loader) {
            loader.style.opacity = "0";
            setTimeout(function() { if (loader && loader.parentNode) loader.remove(); }, 300);
          }
        }, 1500);

        // Unregister any stale ServiceWorkers from previous PWA builds
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.getRegistrations().then(function (registrations) {
            for (var i = 0; i < registrations.length; i++) {
              registrations[i].unregister();
            }
          });
        }
      </script>
    </div>

    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
