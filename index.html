<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="logo-pitangueiras.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="theme-color" content="#40800c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Locaprancha" />
    <link rel="apple-touch-icon" href="logo-pitangueiras.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta
      name="description"
      content="Locaprancha - Sistema inteligente de gestão de frota e transporte de equipamentos para a Usina Pitangueiras."
    />
    <meta
      name="keywords"
      content="gestão de frota, transporte de máquinas, usina pitangueiras, logística, equipamentos"
    />

    <meta property="og:title" content="Locaprancha - Gestão de Frota" />
    <meta
      property="og:description"
      content="Sistema inteligente de gestão de frota e transporte de equipamentos."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://julianotimoteo.github.io/locaprancha/" />
    <meta
      property="og:image"
      content="https://julianotimoteo.github.io/locaprancha/logo-pitangueiras.png"
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Locaprancha - Gestão de Frota" />
    <meta
      name="twitter:description"
      content="Sistema inteligente de gestão de frota e transporte de equipamentos para a Usina Pitangueiras."
    />
    <meta
      name="twitter:image"
      content="https://julianotimoteo.github.io/locaprancha/logo-pitangueiras.png"
    />

    <title>Locaprancha - Gestão de Frota</title>
  </head>
  <body class="bg-background">
    <div id="root"></div>

    <!-- Emergency Loader (Regra 28: Anti-Tela Branca) -->
    <div
      id="emergency-loader"
      style="
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: white;
        z-index: 9999;
        font-family: sans-serif;
        padding: 20px;
        text-align: center;
      "
    >
      <div
        style="
          width: 40px;
          height: 40px;
          border: 4px solid #40800c;
          border-top-color: transparent;
          border-radius: 50%;
          animation: spin 1s linear infinite;
          margin-bottom: 20px;
        "
      ></div>
      <h2 style="font-weight: 900; text-transform: uppercase; margin: 0; letter-spacing: -1px">
        Locaprancha
      </h2>
      <p
        style="
          font-size: 12px;
          color: #666;
          margin-top: 10px;
          font-weight: bold;
          text-transform: uppercase;
          letter-spacing: 1px;
        "
      >
        Sincronizando ambiente seguro...
      </p>

      <div id="error-diagnosis" style="display: none; margin-top: 20px; max-width: 300px">
        <p style="font-size: 11px; color: #ef4444; margin-bottom: 15px; line-height: 1.4">
          O sistema detectou uma falha na inicialização do React. Isso geralmente ocorre devido a
          cache corrompido ou incompatibilidade de versão.
        </p>
        <button
          id="reset-storage-html"
          style="
            width: 100%;
            padding: 14px 20px;
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 900;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(239, 68, 68, 0.4);
            transition: transform 0.2s ease;
          "
        >
          LIMPAR CACHE E REINICIAR
        </button>
      </div>

      <style>
        @keyframes spin {
          to {
            transform: rotate(360deg);
          }
        }
        #reset-storage-html:active {
          transform: scale(0.95);
        }
      </style>
      <script>
        // Versão v1.7.1 - Anti-White-Screen Guard Reinforced (Loop-Protected)
        let autoRetryCount = parseInt(localStorage.getItem("locaprancha_auto_retry") || "0");

        setTimeout(() => {
          const root = document.getElementById("root");
          const isEmpty = !root || root.innerHTML.trim() === "";

          if (isEmpty) {
            console.error("[ANTI-WHITE-SCREEN] Falha crítica de montagem detectada.");

            if (autoRetryCount < 1) {
              const nextRetry = autoRetryCount + 1;
              console.warn(
                "[ANTI-WHITE-SCREEN] Tentando recuperação automática (" + nextRetry + ")...",
              );

              // Limpar cache mas PRESERVAR o contador de retry
              localStorage.clear();
              sessionStorage.clear();
              localStorage.setItem("locaprancha_auto_retry", nextRetry.toString());

              if ("serviceWorker" in navigator) {
                navigator.serviceWorker.getRegistrations().then((registrations) => {
                  for (let registration of registrations) registration.unregister();
                });
              }
              window.location.href =
                window.location.origin + window.location.pathname + "?auto-reset=" + Date.now();
            } else {
              // Tentativa final automática antes de mostrar o erro
              console.error(
                "[ANTI-WHITE-SCREEN] Recuperação falhou. Executando reset forçado final...",
              );
              localStorage.clear();
              sessionStorage.clear();
              localStorage.removeItem("locaprancha_auto_retry");
              window.location.href =
                window.location.origin + window.location.pathname + "?final-reset=" + Date.now();
            }
          } else {
            const loader = document.getElementById("emergency-loader");
            if (loader && !isEmpty) {
              loader.style.display = "none";
              // Apenas limpa se o app montou com sucesso
              localStorage.removeItem("locaprancha_auto_retry");
            }
          }
        }, 8000); // Aumentado para 8s para evitar falsos positivos em redes lentas

        document.getElementById("reset-storage-html")?.addEventListener("click", () => {
          console.warn("[ANTI-WHITE-SCREEN] Executando Hard Reset Manual via HTML...");
          localStorage.clear();
          sessionStorage.clear();
          localStorage.removeItem("locaprancha_auto_retry");
          if ("serviceWorker" in navigator) {
            navigator.serviceWorker.getRegistrations().then((registrations) => {
              for (let registration of registrations) registration.unregister();
            });
          }
          fetch(window.location.href, { cache: "reload", mode: "no-cors" }).finally(() => {
            window.location.href =
              window.location.origin + window.location.pathname + "?reset=" + Date.now();
          });
        });
      </script>
    </div>

    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
