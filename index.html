    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <link rel="apple-touch-icon" href="logo-pitangueiras.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta
      name="description"
      content="Locaprancha - Sistema inteligente de gestão de frota e transporte de equipamentos para a Usina Pitangueiras."
    />
    <meta
      name="keywords"
      content="gestão de frota, transporte de máquinas, usina pitangueiras, logística, equipamentos"
    />

    <meta property="og:title" content="Locaprancha - Gestão de Frota" />
    <meta
      property="og:description"
      content="Sistema inteligente de gestão de frota e transporte de equipamentos."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://julianotimoteo.github.io/locaprancha/" />
    <meta
      property="og:image"
      content="https://julianotimoteo.github.io/locaprancha/logo-pitangueiras.png"
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Locaprancha - Gestão de Frota" />
    <meta
      name="twitter:description"
      content="Sistema inteligente de gestão de frota e transporte de equipamentos para a Usina Pitangueiras."
    />
    <meta
      name="twitter:image"
      content="https://julianotimoteo.github.io/locaprancha/logo-pitangueiras.png"
    />

    <title>Locaprancha - Gestão de Frota</title>
  </head>
  <body class="bg-background">
    <div id="root"></div>

    <!-- Emergency Loader (Regra 28: Anti-Tela Branca) -->
    <div
      id="emergency-loader"
      style="
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: white;
        z-index: 9999;
        font-family: sans-serif;
        padding: 20px;
        text-align: center;
      "
    >
      <div
        style="
          width: 40px;
          height: 40px;
          border: 4px solid #40800c;
          border-top-color: transparent;
          border-radius: 50%;
          animation: spin 1s linear infinite;
          margin-bottom: 20px;
        "
      ></div>
      <h2 style="font-weight: 900; text-transform: uppercase; margin: 0; letter-spacing: -1px">
        Locaprancha
      </h2>
      <p
        style="
          font-size: 12px;
          color: #666;
          margin-top: 10px;
          font-weight: bold;
          text-transform: uppercase;
          letter-spacing: 1px;
        "
      >
        Sincronizando ambiente seguro...
      </p>

      <div id="error-diagnosis" style="display: none; margin-top: 20px; max-width: 300px">
        <p style="font-size: 11px; color: #ef4444; margin-bottom: 15px; line-height: 1.4">
          O sistema detectou uma falha na inicialização. Tentando recuperação automática...
        </p>
      </div>

      <style>
        @keyframes spin {
          to {
            transform: rotate(360deg);
          }
        }
        #reset-storage-html:active {
          transform: scale(0.95);
        }
      </style>
      <script>
        // Versão v1.8.0 - Automatic Hard Recovery (No UI required)
        let autoRetryCount = parseInt(localStorage.getItem("locaprancha_auto_retry") || "0");
        let appMounted = false;

        const performHardReset = () => {
          console.warn("[RECOVERY] Executando Hard Reset Automático...");
          localStorage.clear();
          sessionStorage.clear();
          
          if ("serviceWorker" in navigator) {
            navigator.serviceWorker.getRegistrations().then((registrations) => {
              for (let registration of registrations) registration.unregister();
            });
          }

          if ("caches" in window) {
            caches.keys().then((names) => {
              for (let name of names) caches.delete(name);
            });
          }

          const nextRetry = autoRetryCount + 1;
          localStorage.setItem("locaprancha_auto_retry", nextRetry.toString());
          
          window.location.href = window.location.origin + window.location.pathname + "?reset=" + Date.now();
        };

        const checkMount = () => {
          const root = document.getElementById("root");
          const isEmpty = !root || root.innerHTML.trim() === "";
          if (!isEmpty) {
            appMounted = true;
            const loader = document.getElementById("emergency-loader");
            if (loader) loader.style.display = "none";
            localStorage.removeItem("locaprancha_auto_retry");
            return true;
          }
          return false;
        };

        const mountInterval = setInterval(() => {
          if (checkMount()) clearInterval(mountInterval);
        }, 500);

        setTimeout(() => {
          clearInterval(mountInterval);
          if (!appMounted) {
            if (autoRetryCount < 3) {
              performHardReset();
            } else {
              const diag = document.getElementById("error-diagnosis");
              if (diag) diag.style.display = "block";
              // Tentar um último reset após 5 segundos se nada mudar
              setTimeout(performHardReset, 5000);
            }
          }
        }, 6000);
      </script>
    </div>

    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
