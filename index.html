      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    />

    <meta property="og:title" content="Locaprancha - Gestão de Frota" />
    <meta

      content="Sistema inteligente de gestão de frota e transporte de equipamentos."

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Locaprancha - Gestão de Frota" />
    <meta
      name="twitter:description"
      content="Sistema inteligente de gestão de frota e transporte de equipamentos para a Usina Pitangueiras."
    />
    <meta
      name="twitter:image"
      content="https://julianotimoteo.github.io/locaprancha/logo-pitangueiras.png"
    />

    <title>Locaprancha - Gestão de Frota</title>
  </head>
  <body class="bg-background">
    <div id="root"></div>

    <!-- Emergency Loader (Regra 28: Anti-Tela Branca) -->
    <div
      id="emergency-loader"
      style="
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: white;
        z-index: 9999;
        font-family: sans-serif;
        padding: 20px;
        text-align: center;
      "
    >
      <div
        style="
          width: 40px;
          height: 40px;
          border: 4px solid #40800c;
          border-top-color: transparent;
          border-radius: 50%;
          animation: spin 1s linear infinite;
          margin-bottom: 20px;
        "
      ></div>
      <h2 style="font-weight: 900; text-transform: uppercase; margin: 0; letter-spacing: -1px; color: #1e293b">
        Locaprancha
      </h2>
      <p
        style="
          font-size: 10px;
          color: #64748b;
          margin-top: 8px;
          font-weight: 800;
          text-transform: uppercase;
          letter-spacing: 2px;
        "
      >
        Sincronizando ambiente...
      </p>

      <div id="error-diagnosis" style="display: none; margin-top: 30px; max-width: 320px; animation: fadeIn 0.5s ease-out">
        <div style="background: #fef2f2; border: 1px solid #fee2e2; padding: 16px; border-radius: 12px; margin-bottom: 20px">
          <p style="font-size: 12px; color: #991b1b; font-weight: 700; margin-bottom: 4px; text-transform: uppercase">
            ⚠️ Falha na Inicialização
          </p>
          <p style="font-size: 11px; color: #b91c1c; line-height: 1.5; margin: 0">
            Ocorreu um erro ao carregar o aplicativo. Isso pode ser causado por cache antigo ou instabilidade na conexão.
          </p>
        </div>
        
        <button 
          id="manual-reset-btn"
          onclick="performHardReset()"
          style="
            background: #1e293b;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            transition: all 0.2s;
            width: 100%;
          "
        >
          Limpar Cache e Tentar Novamente
        </button>
      </div>

      <style>
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes spin { to { transform: rotate(360deg); } }
        #manual-reset-btn:hover { background: #0f172a; transform: translateY(-1px); }
        #manual-reset-btn:active { transform: translateY(0); }
      </style>
      <script>
        // Versão v1.8.1 - Automatic Hard Recovery (No UI required)
        let autoRetryCount = parseInt(localStorage.getItem("locaprancha_auto_retry") || "0");
        let appMounted = false;

        const performHardReset = () => {
          console.warn("[RECOVERY] Executando Hard Reset Automático...");
          localStorage.clear();
          sessionStorage.clear();
          
          if ("serviceWorker" in navigator) {
            navigator.serviceWorker.getRegistrations().then((registrations) => {
              for (let registration of registrations) registration.unregister();
            });
          }

          if ("caches" in window) {
            caches.keys().then((names) => {
              for (let name of names) caches.delete(name);
            });
          }

          const nextRetry = autoRetryCount + 1;
          localStorage.setItem("locaprancha_auto_retry", nextRetry.toString());
          
          window.location.href = window.location.origin + window.location.pathname + "?reset=" + Date.now();
        };

        const checkMount = () => {
          const root = document.getElementById("root");
          const isEmpty = !root || root.innerHTML.trim() === "";
          if (!isEmpty) {
            appMounted = true;
            const loader = document.getElementById("emergency-loader");
            if (loader) loader.style.display = "none";
            localStorage.removeItem("locaprancha_auto_retry");
            return true;
          }
          return false;
        };

        const mountInterval = setInterval(() => {
          if (checkMount()) clearInterval(mountInterval);
        }, 500);

        setTimeout(() => {
          clearInterval(mountInterval);
          if (!appMounted) {
            if (autoRetryCount < 3) {
              performHardReset();
            } else {
              const diag = document.getElementById("error-diagnosis");
              if (diag) diag.style.display = "block";
              // Tentar um último reset após 5 segundos se nada mudar
              setTimeout(performHardReset, 5000);
            }
          }
        }, 6000);
      </script>
    </div>

    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
