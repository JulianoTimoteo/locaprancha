name: Deploy LOCAPRANCHA

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:

  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Vite
        run: npm run build

      - name: Validate dist
        run: |
          echo "Validando build..."

          test -f dist/index.html
          test -d dist/assets

          if grep -q "/src/main.tsx" dist/index.html; then
            echo "ERRO: dist/index.html ainda referencia src/main.tsx"
            exit 1
          fi

          if grep -q 'src="/src/' dist/index.html; then
            echo "ERRO: dist/index.html referencia código-fonte"
            exit 1
          fi

          echo "BUILD VALIDADO COM SUCESSO"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    needs: build

    steps:

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
